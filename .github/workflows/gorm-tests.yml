name: GORM-tests

on:
  push:
  pull_request:

jobs:
  # Label of the container job
  gorm-test:
    strategy:
      matrix:
        go: ['1.26', '1.25']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        check-latest: true
    - run: go version

    - name: Check out this repo
      uses: actions/checkout@v7
      with:
        path: sqlite

    - name: Check out GORM repo
      uses: actions/checkout@v7
      with:
        repository: go-gorm/gorm
        path: gorm

    - name: patch gorm test to use this repo as SQLite driver
      working-directory: ./gorm/tests
      shell: bash
      # note portable syntax of sed (both GNU and BSD version work with -i.bak cheat, see https://stackoverflow.com/a/44864004
      # the sqlite checkout is at ../sqlite (one level up from gorm/tests)
      run: |
        sed -i.bak '/gorm.io\/driver\/sqlite/d' go.mod
        echo "replace github.com/qist/sqlite => ../../sqlite/" >> go.mod
        sed -i.bak 's:gorm.io/driver/sqlite:github.com/qist/sqlite:g' tests_test.go
        # GORM master may declare 'go 1.24.0' (with patch), which older toolchains reject.
        # Normalize the go directive to the major.minor format required by the matrix version.
        sed -i.bak -E "s/^go [0-9]+\.[0-9]+\.[0-9]+$/go ${{ matrix.go }}/" go.mod
        go mod tidy
        cat go.mod

    - name: Build (sqlite driver)
      working-directory: ./sqlite
      shell: bash
      run: go build ./... && go vet ./...

    - name: run gorm tests
      working-directory: ./gorm/tests
      shell: bash
      # GORM's master test suite can be flaky under -race on CI runners, so retry.
      run: |
        set -o pipefail
        OUT="tests-${{ matrix.platform }}-${{ matrix.go }}.out"
        for i in 1 2 3; do
          if go test -race -v -count=1 ./... 2>&1 | tee "$OUT"; then
            echo "gorm tests passed on attempt $i"
            exit 0
          fi
          echo "gorm tests failed on attempt $i, retrying..."
          rm -f "$OUT"
        done
        exit 1

    - name: view failed tests result
      if: ${{ failure() }}
      working-directory: ./gorm/tests
      shell: bash
      run: grep -E '^--- FAIL' tests-${{ matrix.platform }}-${{ matrix.go }}.out || true

    - name: save tests results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: tests-${{ matrix.platform }}-${{ matrix.go }}
        path: ./gorm/tests/tests-${{ matrix.platform }}-${{ matrix.go }}.out
