name: GORM-tests

on:
  push:
  pull_request:

# Cancel in-progress runs on the same branch when new commits arrive.
concurrency:
  group: gorm-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gorm-test:
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        go: ['1.26', '1.25']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        check-latest: true
        cache: false   # manual cache below covers both repos

    - run: go version

    - name: Check out this repo
      uses: actions/checkout@v7
      with:
        path: sqlite

    - name: Check out GORM repo
      uses: actions/checkout@v7
      with:
        repository: go-gorm/gorm
        path: gorm

    # Cache both the driver's and GORM's module downloads in a single
    # composite cache key. Falls back to a partial restore when the
    # go.sum hasn't been seen yet.
    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
        key: ${{ matrix.platform }}-go-${{ matrix.go }}-${{ hashFiles('sqlite/go.sum', 'gorm/tests/go.sum') }}
        restore-keys: |
          ${{ matrix.platform }}-go-${{ matrix.go }}-

    - name: Patch GORM test to use this repo as SQLite driver
      working-directory: ./gorm/tests
      shell: bash
      # Portable sed syntax (works on both GNU and BSD/macOS, see
      # https://stackoverflow.com/a/44864004). The sqlite checkout is
      # at ../../sqlite (two levels up from gorm/tests).
      run: |
        sed -i.bak '/gorm.io\/driver\/sqlite/d' go.mod
        echo "replace github.com/qist/sqlite => ../../sqlite/" >> go.mod
        sed -i.bak 's:gorm.io/driver/sqlite:github.com/qist/sqlite:g' tests_test.go
        # GORM master may declare 'go 1.24.0' (with patch), which older
        # toolchains reject. Normalize to major.minor for the matrix version.
        sed -i.bak -E "s/^go [0-9]+\.[0-9]+\.[0-9]+$/go ${{ matrix.go }}/" go.mod
        go mod tidy
        cat go.mod

    - name: Build & vet (sqlite driver)
      working-directory: ./sqlite
      shell: bash
      run: go build ./... && go vet ./...

    - name: Run GORM tests
      working-directory: ./gorm/tests
      shell: bash
      # Retry up to 3 times: GORM's master test suite can be flaky
      # under -race on CI runners (especially Windows/macOS).
      run: |
        set -o pipefail
        OUT="tests-${{ matrix.platform }}-${{ matrix.go }}.out"
        for i in 1 2 3; do
          if go test -race -v -count=1 -timeout 600s ./... 2>&1 | tee "$OUT"; then
            echo "gorm tests passed on attempt $i"
            exit 0
          fi
          echo "gorm tests failed on attempt $i, retrying..."
          rm -f "$OUT"
        done
        exit 1

    - name: Show failed tests
      if: ${{ failure() }}
      working-directory: ./gorm/tests
      shell: bash
      run: grep -E '^--- FAIL' tests-${{ matrix.platform }}-${{ matrix.go }}.out || true

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: tests-${{ matrix.platform }}-${{ matrix.go }}
        path: ./gorm/tests/tests-${{ matrix.platform }}-${{ matrix.go }}.out
        if-no-files-found: ignore
