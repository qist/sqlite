name: CI

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        # modernc.org/sqlite v1.60.0+ requires Go 1.26; setup-go pins
        # GOTOOLCHAIN=local, so Go 1.25 cannot build or test this module.
        go: ['1.27', '1.26']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        check-latest: true
    - run: go version
    
    - uses: actions/checkout@v7
    - name: Build
      run: go build ./...
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -v -cover ./...
